name: Build Shadow Rift Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive if present
        run: |
          if [ -f ShadowRift_Android_Project.zip ]; then unzip -o ShadowRift_Android_Project.zip; fi
          if [ -d ShadowRift_Android ]; then cp -r ShadowRift_Android/. .; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Validate project
        run: godot --headless --editor --path . --quit
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/ShadowRift.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShadowRift-Android-APK
          path: build/ShadowRift.apk
          if-no-files-found: error
